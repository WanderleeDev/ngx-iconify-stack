<footer class="border-t-[1.5px] border-border py-12 px-6 mt-8" role="contentinfo">
  <div class="max-w-[900px] mx-auto flex flex-col items-center gap-4 text-center">
    <div class="flex items-center gap-2 font-bold text-base">
      <ngx-iconify icon="tabler:package" [size]="22" class="text-accent" />
      <span
        class="bg-gradient-brand [-webkit-background-clip:text] [-webkit-text-fill-color:transparent] [background-clip:text]"
        >ngx-iconify-stack</span
      >
    </div>

    <p class="text-muted text-[0.875rem] m-0 flex items-center justify-center gap-1 flex-wrap">
      Built with
      <ngx-iconify icon="mdi:heart" [size]="14" class="text-[oklch(60%_0.22_25)]" aria-label="love" />
      for the Angular community. Powered by
      <a
        href="https://iconify.design"
        target="_blank"
        rel="noopener noreferrer"
        class="text-accent no-underline font-semibold hover:underline"
        >Iconify</a
      >.
    </p>

    <div class="flex gap-3 mt-1" role="list">
      <a
        id="footer-npm"
        href="https://www.npmjs.com/package/ngx-iconify-stack"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center w-9 h-9 rounded-lg border-[1.5px] border-border bg-surface-2 text-muted transition-all duration-200 no-underline hover:text-accent hover:border-accent hover:bg-[color-mix(in_oklch,var(--color-accent)_8%,var(--color-surface-2))] hover:-translate-y-0.5"
        aria-label="NPM package"
        role="listitem"
      >
        <ngx-iconify icon="mdi:npm" [size]="20" />
      </a>
      <a
        id="footer-github"
        href="https://github.com/WanderleeDev/ngx-iconify-stack"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center w-9 h-9 rounded-lg border-[1.5px] border-border bg-surface-2 text-muted transition-all duration-200 no-underline hover:text-accent hover:border-accent hover:bg-[color-mix(in_oklch,var(--color-accent)_8%,var(--color-surface-2))] hover:-translate-y-0.5"
        aria-label="GitHub repository"
        role="listitem"
      >
        <ngx-iconify icon="mdi:github" [size]="20" />
      </a>
      <a
        id="footer-iconify"
        href="https://iconify.design"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center w-9 h-9 rounded-lg border-[1.5px] border-border bg-surface-2 text-muted transition-all duration-200 no-underline hover:text-accent hover:border-accent hover:bg-[color-mix(in_oklch,var(--color-accent)_8%,var(--color-surface-2))] hover:-translate-y-0.5"
        aria-label="Iconify website"
        role="listitem"
      >
        <ngx-iconify icon="simple-icons:iconify" [size]="18" />
      </a>
    </div>

    <p class="text-muted text-[0.78rem] m-0 opacity-70">MIT License · ngx-iconify-stack v0.0.1</p>
  </div>
</footer>
