<section
  class="relative flex flex-col items-center text-center pt-28 px-6 pb-20 gap-6 min-h-[85vh] justify-center overflow-clip"
  aria-labelledby="hero-title"
>
  <div
    class="absolute inset-0 pointer-events-none overflow-hidden hidden lg:block"
    aria-hidden="true"
  >
    @for (item of floatingIcons; track item.icon) {
      <div
        class="absolute flex items-center justify-center p-[0.65rem] rounded-[0.85rem] border border-border bg-surface-2 text-body pointer-events-none backdrop-blur-[4px] animate-float-idle"
        [style.top]="item.top"
        [style.left]="item.left"
        [style.opacity]="item.opacity"
        [style.animationDelay]="item.delay"
        [title]="item.label"
      >
        <ngx-iconify [icon]="item.icon" [size]="item.size || 24" />
      </div>
    }
  </div>

  <h1
    id="hero-title"
    class="m-0 text-[clamp(2.8rem,8vw,5.5rem)] font-extrabold leading-none tracking-[-0.04em] relative z-10"
  >
    <span
      class="bg-gradient-brand [-webkit-background-clip:text] [-webkit-text-fill-color:transparent] [background-clip:text]"
      >ngx-iconify-stack</span
    >
  </h1>

  <p class="max-w-[54ch] text-lg leading-relaxed text-muted m-0 relative z-10">
    A lightweight, SSR-safe Angular wrapper for
    <strong class="text-body">Iconify</strong> — 200,000+ icons from 150+ icon sets, driven by
    signals and zero runtime overhead.
  </p>

  <div class="flex flex-wrap gap-3.5 justify-center mt-3 relative z-10">
    <a
      id="hero-npm-link"
      href="https://www.npmjs.com/package/ngx-iconify-stack"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 py-3 px-6 rounded-xl text-sm font-semibold no-underline transition-all duration-200 cursor-pointer bg-gradient-brand text-white shadow-[0_4px_24px_color-mix(in_oklch,var(--color-accent)_35%,transparent)] hover:-translate-y-0.5 hover:shadow-[0_8px_32px_color-mix(in_oklch,var(--color-accent)_45%,transparent)]"
    >
      <ngx-iconify icon="mdi:npm" [size]="20" />
      npm install ngx-iconify-stack
    </a>
    <a
      id="hero-github-link"
      href="https://github.com"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 py-3 px-6 rounded-xl text-sm font-semibold no-underline transition-all duration-200 cursor-pointer bg-transparent text-body border-[1.5px] border-solid border-border hover:bg-surface-2 hover:border-accent"
    >
      <ngx-iconify icon="mdi:github" [size]="20" />
      View on GitHub
    </a>
  </div>
</section>
