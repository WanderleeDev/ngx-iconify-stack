<section
  class="relative flex flex-col items-center text-center pt-28 px-6 pb-20 gap-6 min-h-[85vh] justify-center overflow-clip"
  aria-labelledby="hero-title"
>
  <div
    class="absolute inset-0 pointer-events-none overflow-hidden hidden lg:block"
    aria-hidden="true"
  >
    @for (item of floatingIcons; track item.icon) {
      <div
        class="absolute flex items-center justify-center p-[0.65rem] rounded-[0.85rem] border border-border bg-surface-2 text-body pointer-events-none backdrop-blur-[4px] animate-float-idle"
        [style.top]="item.top"
        [style.left]="item.left"
        [style.opacity]="item.opacity"
        [style.animationDelay]="item.delay"
        [title]="item.label"
      >
        <ngx-iconify [icon]="item.icon" [size]="item.size || 24" />
      </div>
    }
  </div>

  <h1
    id="hero-title"
    class="m-0 text-[clamp(2.8rem,8vw,5.5rem)] flex gap-2 md:gap-4 items-center font-extrabold leading-none tracking-[-0.04em] relative z-10"
    style="perspective: 1000px"
  >
    <span
      class="bg-gradient-brand [-webkit-background-clip:text] [-webkit-text-fill-color:transparent] [background-clip:text]"
      >ngx-iconify-stack</span
    >
    <img
      src="/icon.webp"
      alt="ngx-iconify-stack"
      class="w-12 h-12 md:w-16 md:h-16 lg:w-20 lg:h-20 flex-shrink-0 drop-shadow-[0_8px_16px_rgba(0,0,0,0.1)] transition-transform duration-300 hover:-rotate-6 hover:drop-shadow-[0_12px_24px_rgba(0,0,0,0.15)]"
      style="transform-style: preserve-3d; backface-visibility: hidden"
    />
  </h1>

  <p class="max-w-[54ch] text-lg leading-relaxed text-muted m-0 relative z-10">
    A lightweight, SSR-safe Angular wrapper for
    <strong class="text-body">Iconify</strong> — 200,000+ icons from 150+ icon sets, driven by
    signals and zero runtime overhead.
  </p>

  <div class="flex flex-wrap gap-3.5 justify-center mt-3 relative z-10">
    <button
      id="hero-copy-command"
      (click)="copyCommand()"
      class="inline-flex items-center gap-2 py-3 px-6 rounded-xl text-sm font-semibold transition-all duration-200 cursor-pointer bg-gradient-brand text-white shadow-[0_4px_24px_color-mix(in_oklch,var(--color-accent)_35%,transparent)] hover:-translate-y-0.5 hover:shadow-[0_8px_32px_color-mix(in_oklch,var(--color-accent)_45%,transparent)] border-none"
      [title]="copied() ? 'Copied to clipboard!' : 'Copy installation command'"
    >
      @if (copied()) {
        <ngx-iconify icon="mdi:check" [size]="20" class="text-white" />
        <span>Copied to clipboard!</span>
      } @else {
        <ngx-iconify icon="mdi:console-line" [size]="20" />
        <span class="font-mono">ng add ngx-iconify-stack</span>
        <ngx-iconify icon="mdi:content-copy" [size]="16" class="opacity-80 ml-1" />
      }
    </button>
    <a
      id="hero-github-link"
      href="https://github.com/WanderleeDev/ngx-iconify-stack"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 py-3 px-6 rounded-xl text-sm font-semibold no-underline transition-all duration-200 cursor-pointer bg-transparent text-body border-[1.5px] border-solid border-border hover:bg-surface-2 hover:border-accent"
    >
      <ngx-iconify icon="mdi:github" [size]="20" />
      View on GitHub
    </a>
  </div>
</section>
