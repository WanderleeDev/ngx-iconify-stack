<header
  class="sticky top-0 z-[100] border-b border-border bg-[color-mix(in_oklch,var(--color-surface)_85%,transparent)] backdrop-blur-[12px] [-webkit-backdrop-filter:blur(12px)]"
  role="banner"
>
  <nav
    class="max-w-[900px] mx-auto px-6 h-14 flex items-center justify-between"
    aria-label="Main navigation"
  >
    <a
      href="/"
      class="flex items-center gap-2 no-underline font-bold text-[0.95rem]"
      aria-label="ngx-iconify-stack home"
    >
      <ngx-iconify icon="tabler:package" [size]="20" class="text-accent" />
      <span
        class="bg-gradient-brand [-webkit-background-clip:text] [-webkit-text-fill-color:transparent] [background-clip:text]"
        >ngx-iconify-stack</span
      >
    </a>

    <div class="flex items-center gap-2">
      <a
        id="nav-npm-link"
        href="https://www.npmjs.com/package/ngx-iconify-stack"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center w-8 h-8 rounded-[0.45rem] text-muted no-underline transition-all duration-150 hover:text-accent hover:bg-surface-2"
        aria-label="NPM"
      >
        <ngx-iconify icon="mdi:npm" [size]="18" />
      </a>
      <a
        id="nav-github-link"
        href="https://github.com/WanderleeDev/ngx-iconify-stack"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center justify-center w-8 h-8 rounded-[0.45rem] text-muted no-underline transition-all duration-150 hover:text-accent hover:bg-surface-2"
        aria-label="GitHub"
      >
        <ngx-iconify icon="mdi:github" [size]="18" />
      </a>

      @if (theme.isHydrated()) {
        <button
          id="nav-theme-toggle"
          class="flex items-center justify-center w-8 h-8 rounded-[0.45rem] text-muted no-underline transition-all duration-150 hover:text-accent hover:bg-surface-2 border-none bg-transparent cursor-pointer font-inherit"
          (click)="theme.toggle()"
          [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="theme.isDark() ? 'Light mode' : 'Dark mode'"
        >
          <ngx-iconify
            [icon]="theme.isDark() ? 'mdi:weather-sunny' : 'mdi:weather-night'"
            [size]="18"
          />
        </button>
      } @else {
        <div class="w-8 h-8 rounded-[0.45rem] bg-surface-2" aria-hidden="true"></div>
      }
    </div>
  </nav>
</header>
