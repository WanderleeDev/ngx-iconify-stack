<div class="max-w-[1100px] mx-auto px-6 py-14">
  <nav
    class="md:hidden flex gap-2 overflow-x-auto pb-2 mb-8"
    aria-label="Docs sections"
  >
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="nav-link-active"
        class="nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold whitespace-nowrap no-underline"
      >
        <ngx-iconify [icon]="item.icon" [size]="16" class="flex-shrink-0" />
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="flex gap-10">
    <aside
      class="sticky top-20 self-start hidden md:block w-60 flex-shrink-0"
      aria-label="Docs sections"
    >
      <p class="m-0 mb-3 text-[0.75rem] font-bold text-muted uppercase tracking-[0.06em]">
        Docs
      </p>
      <nav class="flex flex-col gap-1">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="nav-link-active"
            class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-semibold no-underline"
          >
            <ngx-iconify [icon]="item.icon" [size]="18" class="flex-shrink-0" />
            {{ item.label }}
          </a>
        }
      </nav>
    </aside>

    <div class="flex-1 min-w-0">
      <router-outlet />
    </div>
  </div>
</div>
