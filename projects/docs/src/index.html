<!doctype html>
<html lang="en">
  <head>
    <!-- ngx-theme-stack anti-flash -->
    <script>
      (function () {
        try {
          var k = 'ngx-iconify-stack',
            d = 'system',
            m = 'class',
            v = ['system', 'light', 'dark'],
            t = localStorage.getItem(k) || d,
            e = document.documentElement;
          if (!/^[a-zA-Z][a-zA-Z0-9_-]*$/.test(t) || v.indexOf(t) === -1) t = d;
          if (t === 'system')
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (m === 'class' || m === 'both') e.classList.add(t);
          if (m === 'attribute' || m === 'both') e.setAttribute('data-theme', t);
          if (t === 'dark' || t === 'light') e.style.setProperty('color-scheme', t);
        } catch (x) {}
      })();
    </script>
    <meta charset="utf-8" />
    <title>ngx-iconify-stack — Lightweight, SSR-safe Iconify for Angular</title>
    <base href="/" />
    <link rel="icon" type="image/webp" href="/icon.webp" />
    <link rel="shortcut icon" href="/icon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Signal-driven, SSR-safe Iconify wrapper for Angular 20+ with offline icon subsetting and zero runtime overhead."
    />

    <meta property="og:description" content="Signal-driven, SSR-safe Iconify wrapper for Angular 20+ with offline icon subsetting and zero runtime overhead." />

    <meta name="twitter:image" content="https://raw.githubusercontent.com/WanderleeDev/ngx-iconify-stack/main/projects/docs/public/banner.png" />

    <!-- Open Graph / Facebook -->

  </head>
  <body>
    <app-root></app-root>
    <!-- ngx-theme-stack critters-trick -->
    <div
      id="ngx-theme-stack-critters-trick"
      hidden
      aria-hidden="true"
      style="display: none; overflow: hidden; clip-path: inset(50%); position: absolute"
    >
      <div class="light"></div>
      <div class="dark"></div>
    </div>
    <!-- /ngx-theme-stack critters-trick -->
  </body>
