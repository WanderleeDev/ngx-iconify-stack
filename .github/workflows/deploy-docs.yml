name: Deploy Documentation to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'projects/docs/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fresh CI has no dist; the docs prebuild runs `ng g` from the built library,
      # so the library (FESM + compiled schematics) must exist before build:docs.
      - name: Build Library
        run: npm run build:lib

      - name: Build Docs
        run: npm run build:docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ngx-iconify-stack-docs
          directory: dist/docs/browser
          gitToCommitMetadata: true
