name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Detección de Cambios ────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      lib: ${{ steps.filter.outputs.lib }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lib:
              - 'projects/ngx-iconify-stack/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'projects/docs/**'
              - 'projects/ngx-iconify-stack/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  # ── 2. Job para la Librería ────────────────────────────────────────────────
  library:
    needs: changes
    if: ${{ needs.changes.outputs.lib == 'true' }}
    name: Test & Build Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npx ng test ngx-iconify-stack --watch=false

      - name: Build Library
        run: npm run build:lib

  # ── 3. Job para Docs ──────────────────────────────────────────────────────
  docs:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    name: Build Docs App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Library (required for schematics)
        run: npm run build:lib

      - name: Build Docs
        run: npm run build:docs
